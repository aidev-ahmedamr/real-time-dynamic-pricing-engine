services:

  api:

    build: .

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis


  db:

    image: postgres:15

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricing_db

    ports:
      - "5432:5432"

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


  redis:

    image: redis:7

    ports:
      - "6379:6379"
